<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#podGrad)" rx="16"/>
  <!-- Soundwave pattern -->
  <line x1="120" y1="180" x2="120" y2="240" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="150" x2="150" y2="270" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="130" x2="180" y2="290" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <line x1="210" y1="170" x2="210" y2="250" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <!-- Mic Stand -->
  <rect x="290" y="160" width="20" height="40" rx="10" fill="#f43f5e"/>
  <path d="M 280 180 A 20 20 0 0 0 320 180" fill="none" stroke="#e2e8f0" stroke-width="5"/>
  <line x1="300" y1="200" x2="300" y2="250" stroke="#e2e8f0" stroke-width="6"/>
  <ellipse cx="300" cy="255" rx="30" ry="10" fill="#94a3b8"/>
  <!-- ON AIR Badge -->
  <rect x="420" y="150" width="100" height="45" rx="6" fill="#dc2626"/>
  <text x="470" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LIVE</text>
  <text x="300" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Podcast & Audio Studio</text>
  <text x="300" y="100" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Mic Shure MV7 • Peredam Akustik • Rodecaster Pro</text>
</svg>
