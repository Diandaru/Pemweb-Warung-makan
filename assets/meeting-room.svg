  <!-- 6 Kursi -->
  <circle cx="160" cy="270" r="16" fill="#14b8a6"/>
  <circle cx="230" cy="250" r="16" fill="#14b8a6"/>
  <circle cx="370" cy="250" r="16" fill="#14b8a6"/>
  <circle cx="440" cy="270" r="16" fill="#14b8a6"/>
  <circle cx="250" cy="325" r="16" fill="#14b8a6"/>
  <circle cx="350" cy="325" r="16" fill="#14b8a6"/>
  <text x="300" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Creative Meeting Room</text>
  <text x="300" y="95" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Smart TV 4K • Glass Board • Kapasitas 6 Orang</text>
