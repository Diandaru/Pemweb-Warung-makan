      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mrGrad)" rx="16"/>
  <!-- Smart TV Presentation -->
  <rect x="180" y="110" width="240" height="120" rx="8" fill="#111827"/>
